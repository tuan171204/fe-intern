<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register for the Course</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="./js/tailwind.config.js"></script>
  <link rel="stylesheet" href="./css/custom.css" />
</head>
<body class="bg-white pt-28 pb-16">

  <div id="header-container"></div>

  <!-- Main Content -->
  <main class="max-w-3xl mx-auto px-4">
    <h1 class="text-3xl font-extrabold text-left text-[#0D1829] mt-5 mb-10">Register for the Course</h1>

    <form id="register-form" class="space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Name -->
        <div>
          <label class="block font-extrabold text-sm text-gray-800 mb-4">Name</label>
          <input type="text" required placeholder="Enter name" 
            class="w-full text-xs px-4 py-5 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 transition" />
        </div>

        <!-- Email -->
        <div>
          <label class="block font-extrabold text-sm text-gray-800 mb-4">Email</label>
          <input type="email" required placeholder="Enter your email" 
            class="w-full text-xs px-4 py-5 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 transition" />
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Phone -->
        <div>
          <label class="block font-extrabold text-sm text-gray-800 mb-4">Phone</label>
          <input type="tel" required placeholder="Enter your phone number" 
            class="w-full text-xs px-4 py-5 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 transition" />
        </div>

        <!-- Learning form -->
        <div>
          <label class="block font-extrabold text-sm text-black mb-4">Learning form</label>
          <select class="w-full text-xs font-bold px-4 py-5 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 bg-white transition">
            <option value="offline">Learn offline</option>
            <option value="online">Learn online</option>
          </select>
        </div>
      </div>

      <!-- Facebook URL -->
      <div>
        <label class="block font-extrabold text-sm text-gray-800 mb-4">Facebook URL</label>
        <input type="url" placeholder="Enter your facebook URL" 
          class="w-full text-xs px-4 py-5 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 transition" />
      </div>

      <!-- Personal opinion -->
      <div>
        <label class="block font-extrabold text-sm text-gray-800 mb-4">Personal opinion</label>
        <textarea rows="4" placeholder="" 
          class="w-full text-xs px-4 py-5 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 transition resize-none"></textarea>
      </div>

      <!-- Submit Button -->
      <div class="pt-8">
        <button type="submit" class="w-full py-3.5 bg-[#0D1829] text-white font-medium rounded-3xl hover:opacity-90 transition">
            Confirm
        </button>
      </div>
    </form>
  </main>

  <div id="footer-container"></div>

  <script src="./js/main.js"></script>
  <script src="./js/register.js"></script>
</body>
</html>

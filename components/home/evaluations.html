<section id="evaluations-section" class="py-10 md:py-16 lg:py-28 bg-white">
  <div class="container mx-auto px-6 sm:px-8 md:px-12 lg:px-16 max-w-[1280px]">
    
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 lg:gap-8">
      
      <!-- Cột 1: Title & Navigation -->
      <div class="md:col-span-2 lg:col-span-1 flex flex-row lg:flex-col justify-between items-center lg:items-start lg:justify-evenly pb-2 lg:p-4 border-b border-gray-100 lg:border-none">
        <h2 class="text-2xl sm:text-2xl md:text-3xl lg:text-3xl font-extrabold text-slate-900 leading-tight">
          Student <br class="hidden lg:block" />
          Evaluations
        </h2>
        
        <!-- Arrow Buttons -->
        <div class="flex items-center space-x-3 lg:pb-4">
          <button id="testi-prev-btn" class="w-10 h-10 sm:w-12 sm:h-12 rounded-full border border-gray-200 flex items-center justify-center text-gray-400 hover:border-slate-900 hover:text-slate-900 transition-colors">
            <img src="./assets/icons/arrow-left.svg" alt="prev" class="w-4 h-4 opacity-50">
          </button>
          <button id="testi-next-btn" class="w-10 h-10 sm:w-12 sm:h-12 rounded-full border border-slate-900 flex items-center justify-center text-slate-900 hover:bg-slate-900 hover:text-white transition-colors group">
            <img src="./assets/icons/arrow-right.svg" alt="next" class="w-4 h-4 group-hover:brightness-0 group-hover:invert transition-all">
          </button>
        </div>
      </div>

      <!-- Cột 2: Testimonial Component Container -->
      <div id="testimonial-container" class="flex flex-col md:col-span-1">
      </div>

      <!-- Cột 3: Image -->
      <div class="w-full h-full min-h-[180px] sm:min-h-[220px] md:min-h-[300px] md:col-span-1">
        <img src="../../assets/images/student-evaluations.png" alt="Students gathering" class="w-full h-full object-cover rounded-lg lg:rounded-none">
      </div>
      
    </div>
    
  </div>
</section>

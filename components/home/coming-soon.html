              </div>

              <div class="flex flex-col max-w-xl gap-4">
                <div class="pt-10">
                  <span class="text-sm font-medium uppercase tracking-wider text-gray-400 block mb-2">FRONTEND</span>

                <div class="flex items-center space-x-3">

                  <div class="mt-4">

                    <p class="text-2xl font-extrabold text-slate-900">28/02/2023</p>
                  </div>
                  <div class="mt-4">
                    <p class="text-md font-medium text-gray-400 mb-3">Learning form</p>
                    <p class="text-2xl font-extrabold text-slate-900">Offline</p>
                  </div>
                </div>
                <div class="flex flex-wrap gap-4">
                  <a href="register.html" class="px-10 py-4 rounded-full bg-slate-900 text-white font-bold text-sm hover:bg-slate-700 transition-colors shadow-sm">Register for school</a>
                  <a href="#" class="px-14 py-4 rounded-full border border-slate-900 text-slate-900 font-bold text-sm hover:bg-slate-900 hover:text-white transition-colors">See details</a>
                </div>
              </div>
            </div>
          </div>

          <!-- Slide Components 2 -->
          <div class="swiper-slide" role="group" aria-label="2 / 2">
            <div class="relative bg-gray-100 lg:py-10 lg:pl-80 lg:rounded-r-none">
              <div class="lg:absolute lg:top-1/2 lg:-translate-y-1/2 lg:-left-24 w-full lg:w-[320px] xl:w-[360px] aspect-square mb-8 lg:mb-0 z-10 flex justify-center items-center">
                <img src="./assets/images/react-course.png" alt="ReactJS Course" class="max-w-[360px] max-h-[360px] object-contain drop-shadow-xl">
              </div>

              <div class="flex flex-col max-w-xl gap-4">
                <div class="pt-10">
                  <span class="text-sm font-medium uppercase tracking-wider text-gray-400 block mb-2">FRONTEND</span>
                  <h3 class="text-2xl sm:text-3xl font-bold text-slate-900">ReactJS</h3>
                </div>
                <div class="flex items-center space-x-3">
                  <img src="./assets/images/avatar1.png" alt="Jane Cooper" class="w-6 h-6 rounded-full object-cover">
                  <span class="text-sm font-medium text-gray-600">Jane Cooper</span>
                </div>
                <div class="flex gap-16 pt-2 mb-10 max-w-md">
                  <div class="mt-4">
                    <p class="text-md font-medium text-gray-400 mb-3">Opening day</p>
                    <p class="text-2xl font-extrabold text-slate-900">28/02/2023</p>
                  </div>
                  <div class="mt-4">
                    <p class="text-md font-medium text-gray-400 mb-3">Learning form</p>

                </div>
                <div class="flex flex-wrap gap-4">

                  <a href="#" class="px-14 py-4 rounded-full border border-slate-900 text-slate-900 font-bold text-sm hover:bg-slate-900 hover:text-white transition-colors">See details</a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<script>
  (function initComingSoonComponent() {
    if (typeof Swiper === 'undefined') return;

    const swiper = new Swiper('.course-swiper', {
      slidesPerView: 1,
      spaceBetween: 328,
      speed: 800,
      observer: true,
      observeParents: true,
      navigation: {
        nextEl: '.course-next-btn',
        prevEl: '.course-prev-btn',
      },
    });

    setTimeout(() => swiper.update(), 300);
  })();
</script>

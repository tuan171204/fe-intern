<!-- components/home/team.html -->
<section id="team-section" class="py-24 bg-white">
  <div class="container mx-auto px-4 sm:px-12 lg:px-20 max-w-[1280px]">
    
    <!-- Section Header -->
    <div class="flex flex-col md:flex-row md:items-end justify-between gap-8 mb-16">
      
      <!-- Cột text bên trái -->
      <div class="flex flex-col max-w-xl">
        <h2 class="text-md lg:text-3xl font-extrabold text-slate-900 mb-6">
          Appscyclone <span class="text-[#00A8A4]">Team</span>
        </h2>
        <p class="text-gray-500 leading-relaxed text-sm md:text-base">
          A team of enthusiastic instructors and mentors with a lot of experience accumulated from practical projects will accompany you throughout your learning process and career development path.
        </p>
      </div>

      <!-- Buttons bên phải -->
      <div class="flex items-center space-x-3 pb-2">
        <button class="w-12 h-12 rounded-full border border-gray-200 flex items-center justify-center text-gray-400 hover:border-slate-900 hover:text-slate-900 transition-colors">
          <img src="./assets/icons/arrow-left.svg" alt="prev" class="w-3 h-3 opacity-40">
        </button>
        <button class="w-12 h-12 rounded-full border border-slate-900 flex items-center justify-center text-slate-900 hover:bg-slate-900 hover:text-white transition-colors group">
          <img src="./assets/icons/arrow-right.svg" alt="next" class="w-3 h-3 group-hover:brightness-0 group-hover:invert transition-all">
        </button>
      </div>
      
    </div>

    <!-- Layout 4 cột ảnh -->
    <div id="team-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8"></div>
    
  </div>
</section>

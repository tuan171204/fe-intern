<section id="faq-section" class="relative py-16 pb-0 lg:py-32 lg:pb-0 bg-white z-10">
  
  <!-- Layer Trái & Phải -->
  <!-- Ảnh trái: thu nhỏ trên mobile/tablet để không lấn nội dung -->
  <img 
    src="../../assets/images/faq-logo-left.png" 
    alt="Background pattern" 
    class="absolute top-16 sm:top-20 md:top-28 lg:top-32 w-[160px] sm:w-[220px] md:w-[280px] lg:w-[400px] -z-10 pointer-events-none"
  >
  <!-- Ảnh phải -->
  <img 
    src="../../assets/images/faq-logo-right.png" 
    alt="Background pattern" 
    class="absolute right-0 bottom-60 md:bottom-80 lg:bottom-[32%] w-[70px] sm:w-[90px] md:w-[130px] lg:w-[200px] -z-10 pointer-events-none"
  >

  
  <div class="container mx-auto px-6 sm:px-12 md:px-16 lg:px-20 max-w-[1280px]">
    <!-- PHẦN 1: FREQUENTLY ASKED QUESTIONS -->
    <!-- Layout 2 cột được đẩy sớm lên từ md (tablet ngang) thay vì chỉ từ lg -->
    <div class="grid grid-cols-1 md:grid-cols-12 lg:grid-cols-12 gap-8 md:gap-10 lg:gap-12 relative z-20">
      
      <!-- Cột trái: Title -->
      <div class="md:col-span-5 lg:col-span-5">
        <div class="top-24">
          <h2 class="text-2xl lg:text-3xl font-extrabold text-slate-900 leading-loose">
            Frequently <br class="hidden lg:block">
            Asked Questions
          </h2>
        </div>
      </div>

      <!-- Cột phải: Danh sách câu hỏi -->
      <div class="md:col-span-7 lg:col-span-7">
        <div id="faq-list" class="flex flex-col rounded-sm bg-white">

        </div>
      </div>
      
    </div>

    <!-- PHẦN 2: APPSCYCLONE IS A TEAM -->
    <div class="flex flex-col items-center text-center relative z-20 mt-14 sm:mt-16 md:mt-28 lg:mt-60">
      
      <!-- Tile và Subtitle -->
      <div class="mb-10 lg:mb-14">
        <h3 class="text-2xl sm:text-2xl md:text-3xl lg:text-3xl font-extrabold text-slate-900 mb-4">
          Appscyclone is a team
        </h3>
        <p class="text-gray-600 text-sm md:text-base lg:text-sm">
          Everyone for one, one for all
        </p>
      </div>
    </div>
  </div>

   <!-- Ảnh full-width -->
  <div class="w-full max-w-full overflow-hidden leading-none">
    <img 
      src="../../assets/images/appscyclone-team.png" 
      alt="Appscyclone Team" 
      class="w-full h-auto object-cover block -mb-[2px]"
    >
  </div>

</section>

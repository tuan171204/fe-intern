<section class="max-w-7xl mx-auto px-4 sm:px-6 sm:mt-7">
  <div class="bg-gray-100 p-4 md:p-8 lg:p-12">
    <div class="flex flex-col md:flex-row gap-10 lg:gap-16 items-center">
      
      <!-- Cột Trái: Course Info -->
      <div class="w-full md:w-1/2 flex flex-col items-start pl-6 pt-6">
        <span id="hero-category" class="text-gray-500 uppercase text-sm font-normal tracking-normal mb-6">
          <!-- JS Render -->
        </span>
        
        <h1 id="hero-title" class="text-4xl md:text-5xl font-extrabold text-slate-900 mb-8 sm:mb-10">
          <!-- JS Render -->
        </h1>
        
        <!-- Hàng thông tin 3 cột -->
        <div class="grid grid-cols-3 w-full gap-4 mb-8 sm:mb-10">
          <div>
            <p class="text-xs text-gray-500 mb-1">Opening day</p>
            <p id="hero-date" class="text-lg font-extrabold text-slate-900"><!-- JS --></p>
          </div>
          <div>
            <p class="text-xs text-gray-500 mb-1">Time line</p>
            <p id="hero-timeline" class="text-lg font-extrabold text-slate-900"><!-- JS --></p>
          </div>
          <div>
            <p class="text-xs text-gray-500 mb-1">Learning form</p>
            <p id="hero-form" class="text-lg font-extrabold text-slate-900"><!-- JS --></p>
          </div>
        </div>

        <!-- Instructor & Price block -->
        <div class="flex justify-between items-center w-full bg-white py-4 px-5 mb-8 sm:mb-10 shadow-[0_2px_10px_rgba(0,0,0,0.02)]">
          <div class="flex items-center gap-3">
            <img id="hero-avatar" src="" alt="Instructor" class="w-8 h-8 rounded-full object-cover">
            <span id="hero-instructor" class="text-sm font-semibold text-slate-900"></span>
          </div>
          <div id="hero-price" class="text-sm font-extrabold text-slate-900"></div>
        </div>

        <!-- Register -->
        <a href="register.html" class="bg-[#0b132a] cursor-pointer text-white px-20 py-3.5 rounded-full font-bold hover:bg-slate-800 transition-colors text-sm shadow-md">
          Register
        </a>
      </div>

      <!-- Cột Phải: Ảnh -->
      <div class="w-full md:w-1/2 pb-6 lg:pb-0 flex justify-center md:justify-end">
        <img id="hero-image" src="" alt="Course Image" class="w-full max-w-[400px] object-contain drop-shadow-xl">
      </div>

    </div>
  </div>
</section>

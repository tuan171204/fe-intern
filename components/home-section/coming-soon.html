<section id="coming-soon" class="py-10 sm:py-14 md:py-16 px-4 sm:px-6 lg:pl-12 lg:pr-0 bg-white overflow-x-hidden">
  <!-- Section Header -->
  <div class="container mx-auto px-0 sm:px-6 lg:px-12 mb-8 sm:mb-12 lg:mb-16">
    <div class="flex items-center justify-between">
      <h2 class="text-2xl sm:text-3xl lg:text-4xl font-extrabold text-slate-900">
        Course Coming soon
      </h2>

      <!-- Navigation Arrows -->
      <div class="flex items-center space-x-2 sm:space-x-3">
        <button 
          type="button" 
          aria-label="Previous course"
          class="course-prev-btn w-10 h-10 sm:w-12 sm:h-12 rounded-full border border-slate-900 flex items-center justify-center text-slate-900 hover:bg-slate-700 hover:text-white transition-all duration-200 disabled:border-gray-200 disabled:text-gray-500 disabled:cursor-not-allowed disabled:hover:bg-transparent"
        >
          <img src="./assets/icons/arrow-left.svg" alt="arrow left" class="w-4 h-4">
        </button>

        <button 
          type="button" 
          aria-label="Next course"
          class="course-next-btn w-10 h-10 sm:w-12 sm:h-12 rounded-full border border-slate-900 flex items-center justify-center text-slate-900 hover:bg-slate-700 hover:text-white transition-all duration-200 disabled:border-gray-200 disabled:text-gray-300 disabled:cursor-not-allowed disabled:hover:bg-transparent"
        >
          <img src="./assets/icons/arrow-right.svg" alt="arrow right" class="w-4 h-4">
        </button>
      </div>
    </div>
  </div>

  <!-- Swiper Container -->
  <div class="w-full px-0 sm:pl-6 lg:pl-16">
    <div class="max-w-[1080px] ml-auto relative">
      
      <div class="swiper course-swiper overflow-visible">
        <!-- Thêm ID vào đây và làm rỗng bên trong -->
        <div class="swiper-wrapper" id="coming-soon-wrapper">
          <!-- JS sẽ render nội dung các slide vào đây -->
        </div>
      </div>

    </div>
  </div>
</section>
